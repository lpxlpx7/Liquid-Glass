<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liquid Glass Embed Example</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #111; }
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff; }

      /* The stage: everything inside it can sit on glass. */
      .stage { position: fixed; inset: 0; overflow: hidden; }

      nav {
        position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 4px; padding: 6px; border-radius: 999px;
      }
      nav a { color: #fff; text-decoration: none; padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; }
      nav a.on { background: rgba(255, 255, 255, 0.18); }

      .card {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -60%);
        width: min(440px, calc(100vw - 32px)); padding: 28px; border-radius: 32px;
      }
      .card h1 { margin: 0 0 8px; font-size: 30px; }
      .card p { margin: 0 0 20px; line-height: 1.5; opacity: 0.85; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; }
      button {
        border: 0; background: none; color: #fff; font: inherit; font-weight: 600;
        padding: 11px 18px; border-radius: 999px; cursor: pointer;
      }

      .pills { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; gap: 8px; }
      .pills span { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; font-size: 20px; }

      .lens { position: absolute; left: 0; top: 0; width: 120px; height: 120px; border-radius: 50%; cursor: grab; touch-action: none; }
      .hint { position: absolute; left: 16px; bottom: 16px; font-size: 12px; opacity: 0.7; padding: 8px 12px; border-radius: 12px; }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <nav data-glass="regular">
        <a href="#" class="on">Home</a>
        <a href="#">Gallery</a>
        <a href="#">About</a>
        <a href="../">Desktop demo</a>
      </nav>

      <div class="card" data-glass="dark" data-glass-squircle>
        <h1>Liquid Glass anywhere</h1>
        <p>Every element with a <code>data-glass</code> attribute gets a piece of glass that follows its size,
          position and border-radius. Text and buttons stay ordinary HTML.</p>
        <div class="row">
          <button data-glass="tinted" data-glass-interactive id="bg-pattern">Pattern</button>
          <button data-glass="clear" data-glass-interactive id="bg-photo">Photo</button>
          <button data-glass="clear" data-glass-interactive id="toggle-lens">Lens</button>
        </div>
      </div>

      <!-- data-glass-merge: these pills melt into each other where they are close. -->
      <div class="pills">
        <span data-glass="regular" data-glass-interactive>◐</span>
        <span data-glass="regular" data-glass-interactive data-glass-merge="18">✦</span>
        <span data-glass="regular" data-glass-interactive data-glass-merge="18">♥</span>
      </div>

      <!-- Layer 1 refracts the background and the glass below it. -->
      <div class="lens" id="lens" data-glass="lens" data-glass-layer="1"></div>

      <div class="hint" data-glass="dark">Drag the lens. Press the buttons.</div>
    </div>
    <script type="module" src="./embed.ts"></script>
  </body>
</html>
